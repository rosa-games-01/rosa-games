<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/favicon.png" />
  <title>Forum</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #121212;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    .forum-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .forum-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .forum-header h1 {
      font-size: 3rem;
      margin: 0 0 10px 0;
    }

    .create-post-section {
      background: #2b2b2b;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .create-post-section h2 {
      margin-top: 0;
      font-size: 1.3rem;
    }

    .form-group {
      margin: 15px 0;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #1e1e1e;
      color: #f5f5f5;
      font-size: 1rem;
      font-family: Arial, sans-serif;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group input[type="file"] {
      color: #f5f5f5;
    }

    .btn-primary {
      background: #80cbc4;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: #4db6ac;
    }

    .btn-primary:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .posts-section {
      margin-top: 30px;
    }

    .post-card {
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .post-card:hover {
      border-color: #80cbc4;
      transform: translateY(-2px);
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #80cbc4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .post-author-info h3 {
      margin: 0;
      font-size: 1rem;
    }

    .post-author-info .username {
      color: #80cbc4;
      font-size: 0.9rem;
    }

    .post-meta {
      color: #999;
      font-size: 0.85rem;
    }

    .post-delete-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .post-delete-btn:hover {
      background: #d32f2f;
    }

    .post-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .post-preview {
      color: #ccc;
      margin: 10px 0;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post-stats {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #999;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #2b2b2b;
      padding: 30px;
      border-radius: 8px;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #f5f5f5;
      font-size: 2rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #80cbc4;
    }

    .post-full-content {
      margin-top: 20px;
    }

    .attachment {
      margin: 15px 0;
      max-width: 100%;
    }

    .attachment img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 10px 0;
    }

    .attachment a {
      display: inline-block;
      background: #555;
      color: #80cbc4;
      padding: 8px 15px;
      border-radius: 4px;
      text-decoration: none;
      margin: 5px 5px 5px 0;
    }

    .attachment a:hover {
      background: #666;
    }

    .comments-section {
      margin-top: 30px;
      border-top: 1px solid #444;
      padding-top: 20px;
    }

    .add-comment {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .add-comment textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #121212;
      color: #f5f5f5;
      font-size: 0.95rem;
      min-height: 80px;
      resize: vertical;
    }

    .add-comment button {
      margin-top: 10px;
    }

    .comment {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .comment-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .comment-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #80cbc4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .comment-author-info h4 {
      margin: 0;
      font-size: 0.95rem;
    }

    .comment-author-info .username {
      color: #80cbc4;
      font-size: 0.85rem;
    }

    .comment-delete-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .comment-content {
      color: #ddd;
      margin: 10px 0;
      line-height: 1.5;
    }

    .comment-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .like-btn,
    .dislike-btn {
      background: #555;
      color: #f5f5f5;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .like-btn:hover {
      background: #4caf50;
    }

    .dislike-btn:hover {
      background: #f44336;
    }

    .like-btn.liked {
      background: #4caf50;
      color: white;
    }

    .dislike-btn.disliked {
      background: #f44336;
      color: white;
    }

    .auth-modal {
      max-width: 400px;
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: #1e1e1e;
      border: none;
      color: #f5f5f5;
      cursor: pointer;
      font-size: 1rem;
      border-bottom: 3px solid transparent;
    }

    .auth-tab.active {
      border-bottom-color: #80cbc4;
      background: #121212;
    }

    .auth-tab-content {
      display: none;
    }

    .auth-tab-content.active {
      display: block;
    }

    .error-msg {
      background: #f44336;
      color: white;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }

    .success-msg {
      background: #4caf50;
      color: white;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      color: #80cbc4;
      text-decoration: none;
      border: 1px solid rgba(128, 203, 196, 0.5);
      padding: 10px 18px;
      border-radius: 8px;
    }

    .back-link:hover {
      border-color: #80cbc4;
      color: #ffffff;
    }

    .no-posts {
      text-align: center;
      color: #999;
      padding: 40px;
      font-size: 1.1rem;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div class="forum-container">
    <a class="back-link" href="/rosa-games">← Back to Home</a>

    <div class="forum-header">
      <h1>Community Forum</h1>
    </div>

    <div id="create-post-area" style="display: none;">
      <div class="create-post-section">
        <h2>Create a New Post</h2>
        <div class="form-group">
          <label>Post Title</label>
          <input type="text" id="post-title" placeholder="Enter post title" />
        </div>
        <div class="form-group">
          <label>Post Content</label>
          <textarea id="post-content" placeholder="Write your post content here..."></textarea>
        </div>
        <div class="form-group">
          <label>Attach Files (Images, PDFs, Documents, etc.)</label>
          <input type="file" id="post-attachment" multiple />
        </div>
        <button class="btn-primary" onclick="createPost()">Create Post</button>
      </div>
    </div>

    <div id="create-post-prompt" style="text-align: center; margin: 20px 0;">
      <button class="btn-primary" onclick="openAuthModal()">Sign In to Create Post</button>
    </div>

    <div id="posts-container" class="posts-section"></div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-content auth-modal">
      <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      <h2 style="margin-top: 0;">Sign In or Register</h2>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('signin')">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
      </div>

      <!-- Sign In Tab -->
      <div id="signin-tab" class="auth-tab-content active">
        <div class="error-msg" id="signin-error"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signin-username" placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signin-password" placeholder="Enter your password" />
        </div>
        <button class="btn-primary" style="width: 100%;" onclick="signIn()">Sign In</button>
      </div>

      <!-- Register Tab -->
      <div id="register-tab" class="auth-tab-content">
        <div class="error-msg" id="register-error"></div>
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" id="register-display-name" placeholder="Your display name" />
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="register-username" placeholder="Choose a username (no spaces)" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="register-password" placeholder="Choose a password" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="register-confirm-password" placeholder="Confirm password" />
        </div>
        <button class="btn-primary" style="width: 100%;" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- Post Detail Modal -->
  <div id="post-detail-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closePostDetail()">&times;</button>
      <div id="post-detail-content"></div>
    </div>
  </div>

  <script>
    // JSONBin configuration
    const API_KEY = '$2a$10$KQGNonp3GHvHkZHM77tfD.VklK/1pxWWKpMTP3He/P9bKhQQVQAnm';
    const BIN_ID = '69f24dd036566621a807ebb6';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentUser = null;
    let allPosts = [];
    let allUsers = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadForumData();
    });

    // ===== DATA FUNCTIONS =====
    function loadForumData() {
      const container = document.getElementById('posts-container');
      container.innerHTML = '<div class="loading">Loading forum...</div>';

      if (API_KEY === '$2a$10$KQGNonp3GHvHkZHM77tfD.VklK/1pxWWKpMTP3He/P9bKhQQVQAnm' && BIN_ID === '69f24dd036566621a807ebb6') {
        fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } })
          .then(res => res.json())
          .then(data => {
            allUsers = data.record.users || [];
            allPosts = data.record.posts || [];
            loadUser();
            updateForumUI();
            displayPosts();
          })
          .catch(err => {
            console.error('Error loading forum data:', err);
            container.innerHTML = '<div class="no-posts">Error loading forum. Please check your JSONBin API configuration.</div>';
          });
      } else {
        container.innerHTML = '<div class="no-posts">Forum not configured. Please set API_KEY and BIN_ID.</div>';
      }
    }

    function saveForumData() {
      const data = { users: allUsers, posts: allPosts };
      fetch(API_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify(data)
      })
      .catch(err => console.error('Error saving forum data:', err));
    }

    function loadUser() {
      const user = localStorage.getItem('forumUser');
      if (user) {
        currentUser = JSON.parse(user);
      }
    }

    function saveUserSession(user) {
      currentUser = user;
      localStorage.setItem('forumUser', JSON.stringify(user));
    }

    function updateForumUI() {
      const createPostArea = document.getElementById('create-post-area');
      const createPostPrompt = document.getElementById('create-post-prompt');

      if (currentUser) {
        createPostArea.style.display = 'block';
        createPostPrompt.style.display = 'none';
      } else {
        createPostArea.style.display = 'none';
        createPostPrompt.style.display = 'block';
      }
    }

    function openAuthModal() {
      document.getElementById('auth-modal').classList.add('active');
      document.getElementById('signin-username').value = '';
      document.getElementById('signin-password').value = '';
      document.getElementById('register-display-name').value = '';
      document.getElementById('register-username').value = '';
      document.getElementById('register-password').value = '';
      document.getElementById('register-confirm-password').value = '';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.remove('active');
    }

    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-tab-content').forEach(c => c.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tab + '-tab').classList.add('active');

      document.getElementById('signin-error').style.display = 'none';
      document.getElementById('register-error').style.display = 'none';
    }

    function signIn() {
      const username = document.getElementById('signin-username').value.trim();
      const password = document.getElementById('signin-password').value;
      const errorDiv = document.getElementById('signin-error');

      if (!username || !password) {
        errorDiv.textContent = 'Please fill in all fields';
        errorDiv.style.display = 'block';
        return;
      }

      const user = allUsers.find(u => u.username === username);
      if (!user || user.password !== password) {
        errorDiv.textContent = 'The username or password does not match';
        errorDiv.style.display = 'block';
        return;
      }

      saveUserSession(user);
      updateForumUI();
      closeAuthModal();
      loadForumData();
    }

    function register() {
      const displayName = document.getElementById('register-display-name').value.trim();
      const username = document.getElementById('register-username').value.trim();
      const password = document.getElementById('register-password').value;
      const confirmPassword = document.getElementById('register-confirm-password').value;
      const errorDiv = document.getElementById('register-error');

      if (!displayName || !username || !password) {
        errorDiv.textContent = 'Please fill in all fields';
        errorDiv.style.display = 'block';
        return;
      }

      if (username.includes(' ')) {
        errorDiv.textContent = 'Username cannot contain spaces';
        errorDiv.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }

      if (allUsers.find(u => u.username === username)) {
        errorDiv.textContent = 'Username already exists';
        errorDiv.style.display = 'block';
        return;
      }

      const newUser = {
        username,
        displayName,
        password,
        avatar: displayName.charAt(0).toUpperCase()
      };

      allUsers.push(newUser);
      saveForumData();
      saveUserSession(newUser);
      updateForumUI();
      closeAuthModal();
      loadForumData();
    }

    // ===== POST FUNCTIONS =====
    function displayPosts() {
      const container = document.getElementById('posts-container');

      if (allPosts.length === 0) {
        container.innerHTML = '<div class="no-posts">No posts yet. Be the first to post!</div>';
        return;
      }

      container.innerHTML = allPosts.map((post, index) => {
        const isOwnPost = currentUser && currentUser.username === post.author.username;
        const preview = post.content.substring(0, 100) + (post.content.length > 100 ? '...' : '');

        return `
          <div class="post-card" onclick="openPostDetail(${index})">
            <div class="post-header">
              <div class="post-author">
                <div class="post-avatar">${post.author.avatar}</div>
                <div class="post-author-info">
                  <h3>${post.author.displayName}</h3>
                  <div class="username">@${post.author.username}</div>
                </div>
              </div>
              ${isOwnPost ? `<button class="post-delete-btn" onclick="deletePost(${index}, event)">Delete</button>` : ''}
            </div>
            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="post-preview">${escapeHtml(preview)}</div>
            <div class="post-stats">
              <span>💬 ${post.comments.length} comments</span>
              <span>⏰ ${formatDate(post.timestamp)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function createPost() {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const fileInput = document.getElementById('post-attachment');

      if (!title || !content) {
        alert('Please fill in title and content');
        return;
      }

      const post = {
        author: currentUser,
        title,
        content,
        attachments: [],
        comments: [],
        timestamp: Date.now()
      };

      if (fileInput.files.length > 0) {
        let filesProcessed = 0;
        Array.from(fileInput.files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            post.attachments.push({
              name: file.name,
              type: file.type,
              data: e.target.result
            });
            filesProcessed++;
            if (filesProcessed === fileInput.files.length) {
              savePost(post);
            }
          };
          reader.readAsDataURL(file);
        });
      } else {
        savePost(post);
      }
    }

    function savePost(post) {
      allPosts.unshift(post);
      saveForumData();
      document.getElementById('post-title').value = '';
      document.getElementById('post-content').value = '';
      document.getElementById('post-attachment').value = '';
      displayPosts();
    }

    function deletePost(index, event) {
      event.stopPropagation();
      if (!confirm('Are you sure you want to delete this post?')) return;

      allPosts.splice(index, 1);
      saveForumData();
      displayPosts();
    }

    function openPostDetail(index) {
      const post = allPosts[index];
      const modal = document.getElementById('post-detail-modal');
      const content = document.getElementById('post-detail-content');

      let attachmentsHtml = '';
      if (post.attachments && post.attachments.length > 0) {
        attachmentsHtml = '<div class="attachment"><h4>Attachments:</h4>';
        post.attachments.forEach(att => {
          if (att.type.startsWith('image/')) {
            attachmentsHtml += `<img src="${att.data}" alt="${att.name}" />`;
          } else {
            attachmentsHtml += `<a href="${att.data}" download="${att.name}" target="_blank">📎 ${att.name}</a>`;
          }
        });
        attachmentsHtml += '</div>';
      }

      const isOwnPost = currentUser && currentUser.username === post.author.username;

      content.innerHTML = `
        <div class="post-header">
          <div class="post-author">
            <div class="post-avatar">${post.author.avatar}</div>
            <div class="post-author-info">
              <h3>${post.author.displayName}</h3>
              <div class="username">@${post.author.username}</div>
              <div class="post-meta">${formatDate(post.timestamp)}</div>
            </div>
          </div>
          ${isOwnPost ? `<button class="post-delete-btn" onclick="deletePost(${allPosts.indexOf(post)}, event); closePostDetail();">Delete Post</button>` : ''}
        </div>
        <div class="post-full-content">
          <h2 class="post-title">${escapeHtml(post.title)}</h2>
          <p>${escapeHtml(post.content).replace(/\n/g, '<br>')}</p>
          ${attachmentsHtml}
        </div>
        <div class="comments-section">
          <h3>Comments (${post.comments.length})</h3>
          ${currentUser ? `
            <div class="add-comment">
              <textarea id="comment-input" placeholder="Write a comment..."></textarea>
              <button class="btn-primary" onclick="addComment(${index})">Post Comment</button>
            </div>
          ` : `<p><a href="#" onclick="openAuthModal(); return false;">Sign in to comment</a></p>`}
          <div id="comments-list">
            ${post.comments.map((comment, cIdx) => {
              const isOwnComment = currentUser && currentUser.username === comment.author.username;
              return `
                <div class="comment">
                  <div class="comment-header">
                    <div class="comment-author">
                      <div class="comment-avatar">${comment.author.avatar}</div>
                      <div class="comment-author-info">
                        <h4>${comment.author.displayName}</h4>
                        <div class="username">@${comment.author.username}</div>
                        <div class="post-meta">${formatDate(comment.timestamp)}</div>
                      </div>
                    </div>
                    ${isOwnComment ? `<button class="comment-delete-btn" onclick="deleteComment(${index}, ${cIdx})">Delete</button>` : ''}
                  </div>
                  <div class="comment-content">${escapeHtml(comment.content).replace(/\n/g, '<br>')}</div>
                  <div class="comment-actions">
                    <button class="like-btn ${comment.likedBy && comment.likedBy.includes(currentUser?.username) ? 'liked' : ''}" 
                            onclick="likeComment(${index}, ${cIdx})">👍 ${comment.likes || 0}</button>
                    <button class="dislike-btn ${comment.dislikedBy && comment.dislikedBy.includes(currentUser?.username) ? 'disliked' : ''}" 
                            onclick="dislikeComment(${index}, ${cIdx})">👎 ${comment.dislikes || 0}</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      modal.classList.add('active');
    }

    function closePostDetail() {
      document.getElementById('post-detail-modal').classList.remove('active');
    }

    function addComment(postIndex) {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const input = document.getElementById('comment-input');
      const content = input.value.trim();

      if (!content) {
        alert('Please write a comment');
        return;
      }

      const comment = {
        author: currentUser,
        content,
        likes: 0,
        dislikes: 0,
        likedBy: [],
        dislikedBy: [],
        timestamp: Date.now()
      };

      allPosts[postIndex].comments.push(comment);
      saveForumData();
      openPostDetail(postIndex);
    }

    function deleteComment(postIndex, commentIndex) {
      if (!confirm('Are you sure?')) return;

      allPosts[postIndex].comments.splice(commentIndex, 1);
      saveForumData();
      openPostDetail(postIndex);
    }

    function likeComment(postIndex, commentIndex) {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const comment = allPosts[postIndex].comments[commentIndex];
      const username = currentUser.username;

      if (!comment.likedBy) comment.likedBy = [];
      if (!comment.dislikedBy) comment.dislikedBy = [];

      const alreadyLiked = comment.likedBy.includes(username);
      const alreadyDisliked = comment.dislikedBy.includes(username);

      if (alreadyLiked) {
        comment.likedBy = comment.likedBy.filter(u => u !== username);
        comment.likes--;
      } else {
        comment.likedBy.push(username);
        comment.likes++;
        if (alreadyDisliked) {
          comment.dislikedBy = comment.dislikedBy.filter(u => u !== username);
          comment.dislikes--;
        }
      }

      saveForumData();
      openPostDetail(postIndex);
    }

    function dislikeComment(postIndex, commentIndex) {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const comment = allPosts[postIndex].comments[commentIndex];
      const username = currentUser.username;

      if (!comment.likedBy) comment.likedBy = [];
      if (!comment.dislikedBy) comment.dislikedBy = [];

      const alreadyDisliked = comment.dislikedBy.includes(username);
      const alreadyLiked = comment.likedBy.includes(username);

      if (alreadyDisliked) {
        comment.dislikedBy = comment.dislikedBy.filter(u => u !== username);
        comment.dislikes--;
      } else {
        comment.dislikedBy.push(username);
        comment.dislikes++;
        if (alreadyLiked) {
          comment.likedBy = comment.likedBy.filter(u => u !== username);
          comment.likes--;
        }
      }

      saveForumData();
      openPostDetail(postIndex);
    }

    // ===== UTILITY FUNCTIONS =====
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>

    // Initial data for JSONBin (object with empty posts array)
    // Copy this and paste it when creating your bin:
    // {"posts": []}

    function loadPosts() {
      // Fetch posts from JSONBin
      fetch(API_URL, { 
        headers: { 'X-Master-Key': API_KEY } 
      })
      .then(res => res.json())
      .then(data => {
        const posts = data.record.posts || [];
        displayPosts(posts);
      })
      .catch(err => {
        console.error('Error loading posts:', err);
        // Fallback to localStorage if API fails
        const posts = JSON.parse(localStorage.getItem('forumPosts')) || [];
        displayPosts(posts);
      });

    function displayPosts(posts) {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';

      posts.forEach((post, index) => {
        const postDiv = document.createElement('div');
        postDiv.className = 'post';

        let attachmentsHtml = '';
        if (post.attachments && post.attachments.length > 0) {
          attachmentsHtml = '<div class="post-attachments">';
          post.attachments.forEach(att => {
            if (att.type.startsWith('image/')) {
              attachmentsHtml += `<img src="${att.data}" alt="${att.name}" style="max-width: 300px;" />`;
            } else {
              attachmentsHtml += `<a href="${att.data}" download="${att.name}">${att.name}</a>`;
            }
          });
          attachmentsHtml += '</div>';
        }

        postDiv.innerHTML = `
          <div class="post-title">${post.title}</div>
          <div class="post-content">${post.content}</div>
          ${attachmentsHtml}

        `;

    function createPost() {
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const fileInput = document.getElementById('post-attachment');

      if (!title || !content) {
        alert('Please fill in title and content');
        return;
      }

      const post = {
        title,
        content,
        attachments: [],
        likes: 0,
        dislikes: 0,
        timestamp: Date.now()
      };

      if (fileInput.files.length > 0) {
        Array.from(fileInput.files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            post.attachments.push({
              name: file.name,
              type: file.type,
              data: e.target.result
            });
            if (post.attachments.length === fileInput.files.length) {
              savePost(post);
            }
          };
          reader.readAsDataURL(file);
        });
      } else {
        savePost(post);
      }
    }

    function savePost(post) {

      fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } })
      .then(res => res.json())
      .then(data => {
        const posts = data.record.posts || [];

        // Save back to JSONBin
        return fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY

          body: JSON.stringify({posts: posts})
