<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/favicon.png" />
  <title>Forum</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #121212;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    .forum-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .forum-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .forum-header h1 {
      margin: 0;
      font-size: 3rem;
    }

    .forum-auth-section {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .auth-btn {
      background: #80cbc4;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .auth-btn:hover {
      background: #4db6ac;
    }

    .user-profile-circle {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #80cbc4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(128, 203, 196, 0.3);
    }

    .user-profile-circle:hover {
      background: #4db6ac;
      box-shadow: 0 4px 12px rgba(128, 203, 196, 0.5);
      transform: scale(1.05);
    }

    .profile-menu {
      position: absolute;
      bottom: 60px;
      right: 0;
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px 0;
      min-width: 150px;
      display: none;
      z-index: 1001;
    }

    .profile-menu.active {
      display: block;
    }

    .profile-menu button {
      display: block;
      width: 100%;
      padding: 10px 15px;
      background: none;
      border: none;
      color: #f5f5f5;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .profile-menu button:hover {
      background: #3a3a3a;
      color: #80cbc4;
    }

    .create-post-btn {
      background: #80cbc4;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .create-post-btn:hover {
      background: #4db6ac;
    }

    .create-post-section {
      background: #2b2b2b;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .create-post-section h2 {
      margin-top: 0;
      font-size: 1.3rem;
    }

    .form-group {
      margin: 15px 0;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #1e1e1e;
      color: #f5f5f5;
      font-size: 1rem;
      font-family: Arial, sans-serif;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group input[type="file"] {
      color: #f5f5f5;
    }

    .formatting-toolbar {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }

    .format-btn {
      background: #555;
      color: #f5f5f5;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .format-btn:hover {
      background: #666;
    }

    .btn-primary {
      background: #80cbc4;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: #4db6ac;
    }

    .btn-primary:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .posts-section {
      margin-top: 30px;
    }

    .post-card {
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .post-card:hover {
      border-color: #80cbc4;
      transform: translateY(-2px);
    }

    .post-display-file {
      margin-bottom: 15px;
      text-align: center;
    }

    .post-display-file img,
    .post-display-file video {
      max-width: 100%;
      max-height: 300px;
      border-radius: 4px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #80cbc4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .post-author-info h3 {
      margin: 0;
      font-size: 1rem;
    }

    .post-author-info .username {
      color: #80cbc4;
      font-size: 0.9rem;
    }

    .post-meta {
      color: #999;
      font-size: 0.85rem;
    }

    .post-delete-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .post-delete-btn:hover {
      background: #d32f2f;
    }

    .post-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .post-preview {
      color: #ccc;
      margin: 10px 0;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post-stats {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #999;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #2b2b2b;
      padding: 30px;
      border-radius: 8px;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #f5f5f5;
      font-size: 2rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #80cbc4;
    }

    .post-full-content {
      margin-top: 20px;
    }

    .attachment {
      margin: 15px 0;
      max-width: 100%;
    }

    .attachment img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 10px 0;
    }

    .attachment a {
      display: inline-block;
      background: #555;
      color: #80cbc4;
      padding: 8px 15px;
      border-radius: 4px;
      text-decoration: none;
      margin: 5px 5px 5px 0;
    }

    .attachment a:hover {
      background: #666;
    }

    .comments-section {
      margin-top: 30px;
      border-top: 1px solid #444;
      padding-top: 20px;
    }

    .add-comment {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .add-comment textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #121212;
      color: #f5f5f5;
      font-size: 0.95rem;
      min-height: 80px;
      resize: vertical;
    }

    .add-comment button {
      margin-top: 10px;
    }

    .comment {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .comment-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .comment-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #80cbc4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .comment-author-info h4 {
      margin: 0;
      font-size: 0.95rem;
    }

    .comment-author-info .username {
      color: #80cbc4;
      font-size: 0.85rem;
    }

    .comment-delete-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .comment-content {
      color: #ddd;
      margin: 10px 0;
      line-height: 1.5;
    }

    .comment-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .like-btn,
    .dislike-btn {
      background: #555;
      color: #f5f5f5;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .like-btn:hover {
      background: #4caf50;
    }

    .dislike-btn:hover {
      background: #f44336;
    }

    .like-btn.liked {
      background: #4caf50;
      color: white;
    }

    .dislike-btn.disliked {
      background: #f44336;
      color: white;
    }

    .auth-modal {
      max-width: 400px;
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: #1e1e1e;
      border: none;
      color: #f5f5f5;
      cursor: pointer;
      font-size: 1rem;
      border-bottom: 3px solid transparent;
    }

    .auth-tab.active {
      border-bottom-color: #80cbc4;
      background: #121212;
    }

    .auth-tab-content {
      display: none;
    }

    .auth-tab-content.active {
      display: block;
    }

    .error-msg {
      background: #f44336;
      color: white;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }

    .success-msg {
      background: #4caf50;
      color: white;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      color: #80cbc4;
      text-decoration: none;
      border: 1px solid rgba(128, 203, 196, 0.5);
      padding: 10px 18px;
      border-radius: 8px;
    }

    .back-link:hover {
      border-color: #80cbc4;
      color: #ffffff;
    }

    .no-posts {
      text-align: center;
      color: #999;
      padding: 40px;
      font-size: 1.1rem;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div class="forum-container">
    <a class="back-link" href="/">← Back to Home</a>

    <div class="forum-header">
      <h1>Community Forum</h1>
      <button class="create-post-btn" onclick="openCreatePost()" style="display: none;" id="create-post-btn">Create Post</button>
    </div>

    <div id="forum-auth-section" class="forum-auth-section">
      <button class="auth-btn" id="forum-auth-btn" onclick="openAuthModal()">Sign In</button>
      <div class="profile-menu" id="profile-menu">
        <button onclick="goToProfile()">Profile</button>
        <button onclick="logoutForum()">Logout</button>
      </div>
      <div class="user-profile-circle" id="user-circle" onclick="toggleProfileMenu()" style="display:none;"></div>
    </div>

    <div id="create-post-area" style="display: none;">
      <div class="create-post-section">
        <h2>Create a New Post</h2>
        <div class="form-group">
          <label>Display File (Image/Video)</label>
          <input type="file" id="post-display-file" accept="image/*,video/*" />
        </div>
        <div class="form-group">
          <label>Post Title</label>
          <div class="formatting-toolbar">
            <button class="format-btn" onclick="formatText('title', '**', '**')">Bold</button>
            <button class="format-btn" onclick="formatText('title', '*', '*')">Italic</button>
            <button class="format-btn" onclick="formatText('title', '<u>', '</u>')">Underline</button>
          </div>
          <input type="text" id="post-title" placeholder="Enter post title" />
        </div>
        <div class="form-group">
          <label>Post Content</label>
          <div class="formatting-toolbar">
            <button class="format-btn" onclick="formatText('content', '**', '**')">Bold</button>
            <button class="format-btn" onclick="formatText('content', '*', '*')">Italic</button>
            <button class="format-btn" onclick="formatText('content', '<u>', '</u>')">Underline</button>
          </div>
          <textarea id="post-content" placeholder="Write your post content here..."></textarea>
        </div>
        <div class="form-group">
          <label>Attach Additional Files</label>
          <input type="file" id="post-attachment" multiple />
        </div>
        <button class="btn-primary" onclick="createPost()">Create Post</button>
        <button class="btn-primary" style="background: #666; margin-left: 10px;" onclick="closeCreatePost()">Cancel</button>
      </div>
    </div>

    <div id="posts-container" class="posts-section"></div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-content auth-modal">
      <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      <h2 style="margin-top: 0;">Sign In or Register</h2>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('signin')">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
      </div>

      <!-- Sign In Tab -->
      <div id="signin-tab" class="auth-tab-content active">
        <div class="error-msg" id="signin-error"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signin-username" placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signin-password" placeholder="Enter your password" />
        </div>
        <button class="btn-primary" style="width: 100%;" onclick="signIn()">Sign In</button>
      </div>

      <!-- Register Tab -->
      <div id="register-tab" class="auth-tab-content">
        <div class="error-msg" id="register-error"></div>
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" id="register-display-name" placeholder="Your display name" />
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="register-username" placeholder="Choose a username (no spaces)" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="register-password" placeholder="Choose a password" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="register-confirm-password" placeholder="Confirm password" />
        </div>
        <p style="font-size: 0.9rem; color: #ccc; margin: 10px 0;">Note: It may take a minute or two to be able to sign in after creating your account.</p>
        <button class="btn-primary" style="width: 100%;" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- Post Detail Modal -->
  <div id="post-detail-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closePostDetail()">&times;</button>
      <div id="post-detail-content"></div>
    </div>
  </div>

  <script>
    // JSONBin configuration
    const API_KEY = '$2a$10$KQGNonp3GHvHkZHM77tfD.VklK/1pxWWKpMTP3He/P9bKhQQVQAnm';
    const BIN_ID = '69f24dd036566621a807ebb6';
    const API_URL = BIN_ID ? `https://api.jsonbin.io/v3/b/${BIN_ID}` : '';

    let currentUser = null;
    let allPosts = [];
    let allUsers = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadForumData();
      
      // Close profile menu when clicking outside
      document.addEventListener('click', (e) => {
        const menu = document.getElementById('profile-menu');
        const circle = document.getElementById('user-circle');
        if (!menu.contains(e.target) && !circle.contains(e.target)) {
          closeProfileMenu();
        }
      });
    });

    // ===== DATA FUNCTIONS =====
    function loadForumData() {
      const container = document.getElementById('posts-container');
      
      if (!API_KEY || !BIN_ID) {
        container.innerHTML = '<div class="no-posts">Forum is not configured yet. Please contact the administrator to set up JSONBin API credentials.</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading forum...</div>';

      fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } })
        .then(res => res.json())
        .then(data => {
          allUsers = data.record.users || [];
          allPosts = data.record.posts || [];
          updateForumUI();
          displayPosts();
        })
        .catch(err => {
          console.error('Error loading forum data:', err);
          container.innerHTML = '<div class="no-posts">Error loading forum. Please check your JSONBin API configuration.</div>';
        });
    }

    function saveForumData() {
      const data = { users: allUsers, posts: allPosts };
      return fetch(API_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': API_KEY
        },
        body: JSON.stringify(data)
      })
      .catch(err => console.error('Error saving forum data:', err));
    }

    function setCurrentUser(user) {
      currentUser = user;
    }

    function updateForumUI() {
      const authBtn = document.getElementById('forum-auth-btn');
      const userCircle = document.getElementById('user-circle');
      const createBtn = document.getElementById('create-post-btn');

      if (currentUser) {
        authBtn.style.display = 'none';
        userCircle.style.display = 'flex';
        userCircle.textContent = currentUser.displayName.charAt(0).toUpperCase();
        userCircle.title = currentUser.displayName;
        createBtn.style.display = 'block';
      } else {
        authBtn.style.display = 'block';
        userCircle.style.display = 'none';
        createBtn.style.display = 'none';
      }
    }

    function toggleProfileMenu() {
      const menu = document.getElementById('profile-menu');
      menu.classList.toggle('active');
    }

    function closeProfileMenu() {
      const menu = document.getElementById('profile-menu');
      menu.classList.remove('active');
    }

    function logoutForum() {
      currentUser = null;
      closeProfileMenu();
      updateForumUI();
      displayPosts();
    }

    function goToProfile() {
      alert('Profile page coming soon!');
      closeProfileMenu();
    }

    function openCreatePost() {
      if (!currentUser) {
        openAuthModal();
        return;
      }
      document.getElementById('create-post-area').style.display = 'block';
      document.getElementById('create-post-btn').style.display = 'none';
    }

    function closeCreatePost() {
      document.getElementById('create-post-area').style.display = 'none';
      document.getElementById('create-post-btn').style.display = currentUser ? 'block' : 'none';
    }

    function openAuthModal() {
      document.getElementById('auth-modal').classList.add('active');
      document.getElementById('signin-username').value = '';
      document.getElementById('signin-password').value = '';
      document.getElementById('register-display-name').value = '';
      document.getElementById('register-username').value = '';
      document.getElementById('register-password').value = '';
      document.getElementById('register-confirm-password').value = '';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.remove('active');
    }

    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-tab-content').forEach(c => c.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tab + '-tab').classList.add('active');

      document.getElementById('signin-error').style.display = 'none';
      document.getElementById('register-error').style.display = 'none';
    }

    function signIn() {
      const username = document.getElementById('signin-username').value.trim();
      const password = document.getElementById('signin-password').value;
      const errorDiv = document.getElementById('signin-error');

      if (!username || !password) {
        errorDiv.textContent = 'Please fill in all fields';
        errorDiv.style.display = 'block';
        return;
      }

      const user = allUsers.find(u => u.username === username);
      if (!user || user.password !== password) {
        errorDiv.textContent = 'The username or password does not match';
        errorDiv.style.display = 'block';
        return;
      }

      setCurrentUser(user);
      updateForumUI();
      closeAuthModal();
    }

    function register() {
      const displayName = document.getElementById('register-display-name').value.trim();
      const username = document.getElementById('register-username').value.trim();
      const password = document.getElementById('register-password').value;
      const confirmPassword = document.getElementById('register-confirm-password').value;
      const errorDiv = document.getElementById('register-error');

      if (!displayName || !username || !password) {
        errorDiv.textContent = 'Please fill in all fields';
        errorDiv.style.display = 'block';
        return;
      }

      if (username.includes(' ')) {
        errorDiv.textContent = 'Username cannot contain spaces';
        errorDiv.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }

      if (allUsers.find(u => u.username === username)) {
        errorDiv.textContent = 'Username already exists';
        errorDiv.style.display = 'block';
        return;
      }

      const newUser = {
        username,
        displayName,
        password,
        avatar: displayName.charAt(0).toUpperCase()
      };

      allUsers.push(newUser);
      saveForumData().then(() => {
        setCurrentUser(newUser);
        updateForumUI();
        closeAuthModal();
      });
    }

    // ===== POST FUNCTIONS =====
    function displayPosts() {
      const container = document.getElementById('posts-container');

      if (allPosts.length === 0) {
        container.innerHTML = '<div class="no-posts">No posts yet. Be the first to post!</div>';
        return;
      }

      container.innerHTML = allPosts.map((post, index) => {
        const isOwnPost = currentUser && currentUser.username === post.author.username;
        const preview = post.content.substring(0, 100) + (post.content.length > 100 ? '...' : '');

        let displayFileHtml = '';
        if (post.displayFile) {
          if (post.displayFile.type.startsWith('image/')) {
            displayFileHtml = `<div class="post-display-file"><img src="${post.displayFile.data}" alt="${post.displayFile.name}" /></div>`;
          } else if (post.displayFile.type.startsWith('video/')) {
            displayFileHtml = `<div class="post-display-file"><video controls><source src="${post.displayFile.data}" type="${post.displayFile.type}"></video></div>`;
          }
        }

        return `
          <div class="post-card" onclick="openPostDetail(${index})">
            ${displayFileHtml}
            <div class="post-header">
              <div class="post-author">
                <div class="post-avatar">${post.author.avatar}</div>
                <div class="post-author-info">
                  <h3>${post.author.displayName}</h3>
                  <div class="username">@${post.author.username}</div>
                </div>
              </div>
              ${isOwnPost ? `<button class="post-delete-btn" onclick="deletePost(${index}, event)">Delete</button>` : ''}
            </div>
            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="username" style="font-size: 0.85rem; color: #999; margin: 5px 0;">@${post.author.username}</div>
            <div class="post-preview">${escapeHtml(preview)}</div>
            <div class="post-stats">
              <span>💬 ${post.comments.length} comments</span>
              <span>⏰ ${formatDate(post.timestamp)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function createPost() {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const displayFileInput = document.getElementById('post-display-file');
      const fileInput = document.getElementById('post-attachment');

      if (!title || !content) {
        alert('Please fill in title and content');
        return;
      }

      const post = {
        author: currentUser,
        title,
        content,
        displayFile: null,
        attachments: [],
        comments: [],
        timestamp: Date.now()
      };

      let filesToProcess = 0;
      let filesProcessed = 0;

      // Handle display file
      if (displayFileInput.files.length > 0) {
        filesToProcess++;
        const file = displayFileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          post.displayFile = {
            name: file.name,
            type: file.type,
            data: e.target.result
          };
          filesProcessed++;
          if (filesProcessed === filesToProcess) {
            savePost(post);
          }
        };
        reader.readAsDataURL(file);
      }

      // Handle attachments
      if (fileInput.files.length > 0) {
        filesToProcess += fileInput.files.length;
        Array.from(fileInput.files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            post.attachments.push({
              name: file.name,
              type: file.type,
              data: e.target.result
            });
            filesProcessed++;
            if (filesProcessed === filesToProcess) {
              savePost(post);
            }
          };
          reader.readAsDataURL(file);
        });
      }

      if (filesToProcess === 0) {
        savePost(post);
      }
    }

    function savePost(post) {
      allPosts.unshift(post);
      saveForumData();
      document.getElementById('post-title').value = '';
      document.getElementById('post-content').value = '';
      document.getElementById('post-display-file').value = '';
      document.getElementById('post-attachment').value = '';
      closeCreatePost();
      displayPosts();
    }

    function deletePost(index, event) {
      event.stopPropagation();
      if (!confirm('Are you sure you want to delete this post?')) return;

      allPosts.splice(index, 1);
      saveForumData();
      displayPosts();
    }

    function openPostDetail(index) {
      const post = allPosts[index];
      const modal = document.getElementById('post-detail-modal');
      const content = document.getElementById('post-detail-content');

      let displayFileHtml = '';
      if (post.displayFile) {
        if (post.displayFile.type.startsWith('image/')) {
          displayFileHtml = `<div class="post-display-file"><img src="${post.displayFile.data}" alt="${post.displayFile.name}" /></div>`;
        } else if (post.displayFile.type.startsWith('video/')) {
          displayFileHtml = `<div class="post-display-file"><video controls><source src="${post.displayFile.data}" type="${post.displayFile.type}"></video></div>`;
        }
      }

      let attachmentsHtml = '';
      if (post.attachments && post.attachments.length > 0) {
        attachmentsHtml = '<div class="attachment"><h4>Attachments:</h4>';
        post.attachments.forEach(att => {
          if (att.type.startsWith('image/')) {
            attachmentsHtml += `<img src="${att.data}" alt="${att.name}" />`;
          } else {
            attachmentsHtml += `<a href="${att.data}" download="${att.name}" target="_blank">📎 ${att.name}</a>`;
          }
        });
        attachmentsHtml += '</div>';
      }

      const isOwnPost = currentUser && currentUser.username === post.author.username;

      content.innerHTML = `
        ${displayFileHtml}
        <div class="post-header">
          <div class="post-author">
            <div class="post-avatar">${post.author.avatar}</div>
            <div class="post-author-info">
              <h3>${post.author.displayName}</h3>
              <div class="username">@${post.author.username}</div>
              <div class="post-meta">${formatDate(post.timestamp)}</div>
            </div>
          </div>
          ${isOwnPost ? `<button class="post-delete-btn" onclick="deletePost(${allPosts.indexOf(post)}, event); closePostDetail();">Delete Post</button>` : ''}
        </div>
        <div class="post-full-content">
          <h2 class="post-title">${escapeHtml(post.title)}</h2>
          <p>${escapeHtml(post.content).replace(/\n/g, '<br>')}</p>
          ${attachmentsHtml}
        </div>
        <div class="comments-section">
          <h3>Comments (${post.comments.length})</h3>
          ${currentUser ? `
            <div class="add-comment">
              <textarea id="comment-input" placeholder="Write a comment..."></textarea>
              <button class="btn-primary" onclick="addComment(${index})">Post Comment</button>
            </div>
          ` : `<p><a href="#" onclick="openAuthModal(); return false;">Sign in to comment</a></p>`}
          <div id="comments-list">
            ${post.comments.map((comment, cIdx) => {
              const isOwnComment = currentUser && currentUser.username === comment.author.username;
              return `
                <div class="comment">
                  <div class="comment-header">
                    <div class="comment-author">
                      <div class="comment-avatar">${comment.author.avatar}</div>
                      <div class="comment-author-info">
                        <h4>${comment.author.displayName}</h4>
                        <div class="username">@${comment.author.username}</div>
                        <div class="post-meta">${formatDate(comment.timestamp)}</div>
                      </div>
                    </div>
                    ${isOwnComment ? `<button class="comment-delete-btn" onclick="deleteComment(${index}, ${cIdx})">Delete</button>` : ''}
                  </div>
                  <div class="comment-content">${escapeHtml(comment.content).replace(/\n/g, '<br>')}</div>
                  <div class="comment-actions">
                    <button class="like-btn ${comment.likedBy && comment.likedBy.includes(currentUser?.username) ? 'liked' : ''}" 
                            onclick="likeComment(${index}, ${cIdx})">👍 ${comment.likes || 0}</button>
                    <button class="dislike-btn ${comment.dislikedBy && comment.dislikedBy.includes(currentUser?.username) ? 'disliked' : ''}" 
                            onclick="dislikeComment(${index}, ${cIdx})">👎 ${comment.dislikes || 0}</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      modal.classList.add('active');
    }

    function closePostDetail() {
      document.getElementById('post-detail-modal').classList.remove('active');
    }

    function addComment(postIndex) {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const input = document.getElementById('comment-input');
      const content = input.value.trim();

      if (!content) {
        alert('Please write a comment');
        return;
      }

      const comment = {
        author: currentUser,
        content,
        likes: 0,
        dislikes: 0,
        likedBy: [],
        dislikedBy: [],
        timestamp: Date.now()
      };

      allPosts[postIndex].comments.push(comment);
      saveForumData();
      openPostDetail(postIndex);
    }

    function deleteComment(postIndex, commentIndex) {
      if (!confirm('Are you sure?')) return;

      allPosts[postIndex].comments.splice(commentIndex, 1);
      saveForumData();
      openPostDetail(postIndex);
    }

    function likeComment(postIndex, commentIndex) {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const comment = allPosts[postIndex].comments[commentIndex];
      const username = currentUser.username;

      if (!comment.likedBy) comment.likedBy = [];
      if (!comment.dislikedBy) comment.dislikedBy = [];

      const alreadyLiked = comment.likedBy.includes(username);
      const alreadyDisliked = comment.dislikedBy.includes(username);

      if (alreadyLiked) {
        comment.likedBy = comment.likedBy.filter(u => u !== username);
        comment.likes--;
      } else {
        comment.likedBy.push(username);
        comment.likes++;
        if (alreadyDisliked) {
          comment.dislikedBy = comment.dislikedBy.filter(u => u !== username);
          comment.dislikes--;
        }
      }

      saveForumData();
      openPostDetail(postIndex);
    }

    function dislikeComment(postIndex, commentIndex) {
      if (!currentUser) {
        openAuthModal();
        return;
      }

      const comment = allPosts[postIndex].comments[commentIndex];
      const username = currentUser.username;

      if (!comment.likedBy) comment.likedBy = [];
      if (!comment.dislikedBy) comment.dislikedBy = [];

      const alreadyDisliked = comment.dislikedBy.includes(username);
      const alreadyLiked = comment.likedBy.includes(username);

      if (alreadyDisliked) {
        comment.dislikedBy = comment.dislikedBy.filter(u => u !== username);
        comment.dislikes--;
      } else {
        comment.dislikedBy.push(username);
        comment.dislikes++;
        if (alreadyLiked) {
          comment.likedBy = comment.likedBy.filter(u => u !== username);
          comment.likes--;
        }
      }

      saveForumData();
      openPostDetail(postIndex);
    }

    function formatText(field, startTag, endTag) {
      const element = document.getElementById('post-' + field);
      const start = element.selectionStart;
      const end = element.selectionEnd;
      const text = element.value;
      const before = text.substring(0, start);
      const selection = text.substring(start, end);
      const after = text.substring(end);

      element.value = before + startTag + selection + endTag + after;
      element.focus();
      element.setSelectionRange(start + startTag.length, end + startTag.length);
    }

    // ===== UTILITY FUNCTIONS =====
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
