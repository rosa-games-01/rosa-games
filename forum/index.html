<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/favicon.png" />
  <title>Forum</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      background: #121212;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    .forum-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .forum-wrap h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .post-form {
      background: #2b2b2b;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .post-form input,
    .post-form textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #555;
      border-radius: 4px;
      background: #1e1e1e;
      color: #f5f5f5;
      font-size: 1rem;
    }

    .post-form button {
      background: #80cbc4;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .post-form button:hover {
      background: #4db6ac;
    }

    .posts {
      margin-top: 30px;
    }

    .post {
      background: #2b2b2b;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .post-title {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .post-content {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .post-attachments {
      margin-bottom: 15px;
    }

    .post-attachments img,
    .post-attachments a {
      display: block;
      margin: 5px 0;
    }

    .post-actions {
      display: flex;
      gap: 10px;
    }

    .like-btn,
    .dislike-btn {
      background: #555;
      color: #f5f5f5;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .like-btn:hover {
      background: #4caf50;
    }

    .dislike-btn:hover {
      background: #f44336;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      color: #80cbc4;
      text-decoration: none;
      border: 1px solid rgba(128, 203, 196, 0.5);
      padding: 10px 18px;
      border-radius: 8px;
    }

    .back-link:hover {
      border-color: #80cbc4;
      color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="forum-wrap">
    <h1>Community Forum</h1>

    <div class="post-form">
      <input type="text" id="post-title" placeholder="Post Title" required />
      <textarea id="post-content" placeholder="Post Content" rows="5" required></textarea>
      <input type="file" id="post-attachment" multiple accept="image/*, .pdf, .doc, .docx, .txt" />
      <button onclick="createPost()">Create Post</button>
    </div>

    <div class="posts" id="posts-container">
      <!-- Posts will be loaded here -->
    </div>

    <a class="back-link" href="/rosa-games">Back to Home</a>
  </div>

  <script>
    // Replace these with your actual JSONBin credentials
    const API_KEY = '$2a$10$KQGNonp3GHvHkZHM77tfD.VklK/1pxWWKpMTP3He/P9bKhQQVQAnm';
    const BIN_ID = '69f24dd036566621a807ebb6';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    // Initial data for JSONBin (object with empty posts array)
    // Copy this and paste it when creating your bin:
    // {"posts": []}

    function loadPosts() {
      // Fetch posts from JSONBin
      fetch(API_URL, { 
        headers: { 'X-Master-Key': API_KEY } 
      })
      .then(res => res.json())
      .then(data => {
        const posts = data.record.posts || [];
        displayPosts(posts);
      })
      .catch(err => {
        console.error('Error loading posts:', err);
        // Fallback to localStorage if API fails
        const posts = JSON.parse(localStorage.getItem('forumPosts')) || [];
        displayPosts(posts);
      });
    }

    function displayPosts(posts) {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';

      posts.forEach((post, index) => {
        const postDiv = document.createElement('div');
        postDiv.className = 'post';

        let attachmentsHtml = '';
        if (post.attachments && post.attachments.length > 0) {
          attachmentsHtml = '<div class="post-attachments">';
          post.attachments.forEach(att => {
            if (att.type.startsWith('image/')) {
              attachmentsHtml += `<img src="${att.data}" alt="${att.name}" style="max-width: 300px;" />`;
            } else {
              attachmentsHtml += `<a href="${att.data}" download="${att.name}">${att.name}</a>`;
            }
          });
          attachmentsHtml += '</div>';
        }

        postDiv.innerHTML = `
          <div class="post-title">${post.title}</div>
          <div class="post-content">${post.content}</div>
          ${attachmentsHtml}
          <div class="post-actions">
            <button class="like-btn" onclick="likePost(${index})">👍 ${post.likes || 0}</button>
            <button class="dislike-btn" onclick="dislikePost(${index})">👎 ${post.dislikes || 0}</button>
          </div>
        `;

        container.appendChild(postDiv);
      });
    }

    function createPost() {
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const fileInput = document.getElementById('post-attachment');

      if (!title || !content) {
        alert('Please fill in title and content');
        return;
      }

      const post = {
        title,
        content,
        attachments: [],
        likes: 0,
        dislikes: 0,
        timestamp: Date.now()
      };

      if (fileInput.files.length > 0) {
        Array.from(fileInput.files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            post.attachments.push({
              name: file.name,
              type: file.type,
              data: e.target.result
            });
            if (post.attachments.length === fileInput.files.length) {
              savePost(post);
            }
          };
          reader.readAsDataURL(file);
        });
      } else {
        savePost(post);
      }
    }

    function savePost(post) {
      // Get current posts
      fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } })
      .then(res => res.json())
      .then(data => {
        const posts = data.record.posts || [];
        posts.unshift(post);
        
        // Save back to JSONBin
        return fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({posts: posts})
        });
      })
      .then(() => {
        loadPosts();
        // Clear form
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        document.getElementById('post-attachment').value = '';
      })
      .catch(err => {
        console.error('Error saving post:', err);
        // Fallback to localStorage
        const posts = JSON.parse(localStorage.getItem('forumPosts')) || [];
        posts.unshift(post);
        localStorage.setItem('forumPosts', JSON.stringify(posts));
        loadPosts();
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        document.getElementById('post-attachment').value = '';
      });
    }

    function likePost(index) {
      fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } })
      .then(res => res.json())
      .then(data => {
        const posts = data.record.posts || [];
        posts[index].likes = (posts[index].likes || 0) + 1;
        
        return fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({posts: posts})
        });
      })
      .then(() => loadPosts())
      .catch(err => {
        console.error('Error liking post:', err);
        // Fallback
        const posts = JSON.parse(localStorage.getItem('forumPosts')) || [];
        posts[index].likes = (posts[index].likes || 0) + 1;
        localStorage.setItem('forumPosts', JSON.stringify(posts));
        loadPosts();
      });
    }

    function dislikePost(index) {
      fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } })
      .then(res => res.json())
      .then(data => {
        const posts = data.record.posts || [];
        posts[index].dislikes = (posts[index].dislikes || 0) + 1;
        
        return fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({posts: posts})
        });
      })
      .then(() => loadPosts())
      .catch(err => {
        console.error('Error disliking post:', err);
        // Fallback
        const posts = JSON.parse(localStorage.getItem('forumPosts')) || [];
        posts[index].dislikes = (posts[index].dislikes || 0) + 1;
        localStorage.setItem('forumPosts', JSON.stringify(posts));
        loadPosts();
      });
    }

    // Load posts on page load
    loadPosts();
  </script>
</body>

</html>
